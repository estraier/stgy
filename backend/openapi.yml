  /users:
    get:
      summary: List users
      security:
        - sessionCookie: []
      parameters:
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc, social], default: desc }
        - name: after
          in: query
          schema:
            type: string
            pattern: '^(?:0x)?[0-9a-fA-F]{1,16}$'
          description: Exclusive hexadecimal user ID cursor. Supported with order=asc or order=desc and offset=0. Ascending order returns IDs greater than after; descending order returns IDs less than after.
        - name: query
          in: query
          schema: { type: string }
          description: Admin-only PostgreSQL substring search filter. Use /users/search for normal full-text search.
        - name: nickname
          in: query
          schema: { type: string }
        - name: nicknamePrefix
          in: query
          schema: { type: string }
        - name: focusUserId
          in: query
          schema: { type: string }
          description: (Optional) Used with order=social to prioritize followees and followers.
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

    post:
      summary: (Admin only) Create user
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                email: { type: string }
                nickname: { type: string }
                password: { type: string }
                isAdmin: { type: boolean }
                blockStrangers: { type: boolean }
                locale: { type: string }
                timezone: { type: string }
                introduction: { type: string }
                avatar: { type: string, nullable: true }
                aiModel: { type: string, enum: [advanced, balanced, basic], nullable: true }
                aiPersonality: { type: string, nullable: true }
              required:
                [email, nickname, password, isAdmin, blockStrangers, locale, timezone, introduction]
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

