          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: after
          in: query
          schema:
            type: string
            pattern: '^(?:0x)?[0-9a-fA-F]{1,16}$'
          description: Exclusive hexadecimal post ID cursor. Supported with order=asc or order=desc and offset=0. Ascending order returns IDs greater than after; descending order returns IDs less than after.
