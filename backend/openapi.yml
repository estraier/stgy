          in: query
          schema: { type: integer, default: 100 }
        - name: focusUserId
          in: query
          schema: { type: string }
          description: (Optional) Base user whose followees are prioritized. Defaults to current user.
        - name: omitSelf
          in: query
          schema: { type: boolean, default: false }
        - name: omitOthers
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Users list by nickname prefix and priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /posts/kwic:
    get:
      summary: Build KWIC data for posts
      description: |
        Authenticated post-processing endpoint for internal post search results.
        Markdown is split into its title and remaining plain-text body by
        `stgy-markdown`; missing post IDs are omitted. This endpoint does not impose
        the public publication-time restriction. The backend currently uses at most
        4 body segments with 40 STGY pseudo tokens of context on each side.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string }
        - name: keyword
          in: query
          required: true
          description: For full-text search KWIC, pass the phrases returned by /posts/search.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 32
            items: { type: string }
      responses:
        "200":
          description: KWIC data in requested ID order, with missing IDs omitted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KwicItem"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /posts/kwic-pub:
    get:
      summary: Build KWIC data for public posts
      description: |
        Anonymous post-processing endpoint for public search results. Only requested
        posts with a non-null publication time not later than the current time are
        returned; missing, unpublished, and future-published IDs are all omitted.
        No owner parameter is used. A valid `X-STGY-QueryHash` is mandatory, and the
        request uses the shared anonymous database timer throttle. In production this
        endpoint shares the Search Caddy rate-limit zone (60 requests/hour/IP) with
        `/posts/search`.
      security:
        - {}
      parameters:
        - name: id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string }
        - name: keyword
          in: query
          required: true
          description: For public-search KWIC, pass the phrases returned by /posts/search.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 32
            items: { type: string }
        - name: X-STGY-QueryHash
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{40}$' }
          description: SHA-1 of all canonicalized query parameters.
      responses:
        "200":
          description: Public KWIC data in requested ID order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KwicItem"
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"

  /posts/search:
    get:
      summary: Search posts (Full text search)
      description: |
        Logged-in callers retain the normal post-search behavior. Anonymous callers
        are accepted only with a valid `X-STGY-QueryHash` header and an explicit
        `ownedBy`; the backend then forces the search to that owner and to posts whose
        publication time is not later than the current time. Anonymous searches use
        the shared anonymous daily timer throttle. The custom header also makes a
        cross-origin browser request non-simple, so it must pass the backend CORS
        preflight policy before the actual search request can be sent.
      security:
        - sessionCookie: []
        - {}
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
          description: |
            Full-text query. In post search, standalone unquoted tokens of the form
            `owner:<user-id>`, `owner:me`, and `status:published` are interpreted by
            the STGY backend as filters and removed from the text sent to TTTS.
            `owner:me` means the currently logged-in user and is rejected for
            anonymous requests. At least one ordinary full-text search term must
            remain after removing these filters. Anonymous requests are always
            restricted to published posts regardless of whether `status:published`
            is present. The remaining text uses TTTS tokenization and phrase semantics;
            on positional indexes, a whitespace-delimited input unit that tokenizes
            into multiple tokens is searched as one phrase even without double quotes.
        - name: ownedBy
          in: query
          schema: { type: string }
          description: Required for anonymous requests; restricts results to this owner.
        - name: locale
          in: query
          schema: { type: string, default: en }
        - name: limit
          in: query
          schema: { type: integer, default: 21 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
          description: |
            Publication-time order for anonymous public searches. Authenticated
            searches retain the existing TTTS result order.
        - name: X-STGY-QueryHash
          in: header
          schema: { type: string, pattern: '^[0-9a-f]{40}$' }
          description: |
            Required for anonymous requests. SHA-1 of all canonicalized query
            parameters, using the same rules as the anonymous geo endpoints. This
            custom header intentionally requires CORS preflight for cross-origin
            browser requests.
      responses:
        "200":
          description: Search tokens, phrase units, and matching posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostSearchResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"

