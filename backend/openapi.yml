              required: [key]
      responses:
        "200":
          description: Finalized profile master object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaObject"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /media/{userId}/profiles/{slot}:
    get:
      summary: Download profile master image (avatar)
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: slot
          in: path
          required: true
          schema: { type: string, enum: [avatar] }
      responses:
        "200":
          description: Image bytes
          content:
            image/*:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
    delete:
      summary: Delete profile master image (avatar) and clear users.avatar
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: slot
          in: path
          required: true
          schema: { type: string, enum: [avatar] }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string }
                required: [result]
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /notifications/feed:
    get:
      summary: Get notification feed
      security:
        - sessionCookie: []
      parameters:
        - name: newerThan
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Notification feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "304":
          description: Not Modified (no updates since newerThan)
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "400":
          $ref: "#/components/responses/Error400"

  /notifications/mark:
    post:
      summary: Mark a single notification (by slot + term)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slot: { type: string }
                term: { type: string }
                isRead: { type: boolean }
              required: [slot, term, isRead]
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /notifications/mark-all:
    post:
      summary: Mark all notifications for current user
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isRead: { type: boolean }
              required: [isRead]
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /posts/pub/{id}:
    get:
      summary: Get a public post by id (published)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PubPostDetail"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"

  /posts/pub-by-user/{userId}:
    get:
      summary: List public posts by user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Public posts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PubPostDetail"
        "400":
          $ref: "#/components/responses/Error400"

  /posts/pub-by-ids:
    post:
      summary: Get public posts by ID in the requested order
      description: The request is capped at the configured public sidebar maximum. Missing, unpublished, and future-published posts are omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PubPostIdsRequest"
      responses:
        "200":
          description: Public posts in requested ID order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/Error400"

  /users/{id}/pub-ranking:
    get:
      summary: Get public post PV ranking for the configured retention period
      description: Returns only post IDs and PV counts. Values above the configured public sidebar maximum are capped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, default: 5 }
      responses:
        "200":
          description: Public post PV ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PubViewRankEntry"
        "400":
          $ref: "#/components/responses/Error400"

  /users/{id}/pub-stats:
    get:
      summary: Get the user's public post PV statistics
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public post PV statistics for the configured retention period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PubViewStats"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /users/{id}/pub-config:
    get:
      summary: Get user's public site config
      description: Publicly accessible.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public config for the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPubConfig"
        "400":
          $ref: "#/components/responses/Error400"

    put:
      summary: Upsert user's public site config (admin or self)
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                siteName: { type: string }
                subtitle: { type: string }
                author: { type: string }
                introduction: { type: string }
                designTheme: { type: string }
                showServiceHeader: { type: boolean }
                showSiteName: { type: boolean }
                showPagenation: { type: boolean }
                showSideProfile: { type: boolean }
                showSideRecent: { type: integer }
                showSidePopular: { type: integer }
                extensions:
                  $ref: "#/components/schemas/UserPubConfigExtensions"
              description: |
                Note: current server implementation does NOT accept/handle "locale" in this request.
      responses:
        "200":
          description: Saved public config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPubConfig"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
