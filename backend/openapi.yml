  /users/kwic:
    get:
      summary: Build KWIC data for users
      description: |
        Authenticated post-processing endpoint for user search results. The nickname
        is used as the KWIC title and the Markdown introduction is rendered to plain
        text as the body. Missing user IDs are omitted. The backend currently uses
        at most 4 body segments with 40 STGY pseudo tokens of context on each side.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string }
        - name: keyword
          in: query
          required: true
          description: For full-text search KWIC, pass the phrases returned by /users/search.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 32
            items: { type: string }
      responses:
        "200":
          description: KWIC data in requested ID order, with missing IDs omitted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KwicItem"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /users/search:
    get:
      summary: Search users (Full text search)
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
          description: >
            Full-text query using TTTS tokenization and phrase semantics. On positional
            indexes, a whitespace-delimited input unit that tokenizes into multiple
            tokens is searched as one phrase even without double quotes.
        - name: locale
          in: query
          schema: { type: string, default: en }
        - name: ownedBy
          in: query
          description: Restrict full-text search to posts owned by this user ID.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 21 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: locale
          in: query
          schema: { type: string, default: "en" }
      responses:
        "200":
          description: Search tokens, phrase units, and matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

