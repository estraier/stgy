openapi: 3.0.3
info:
  title: TTTS Search Service
  description: |
    TTTS (Time-series Text Tiling Search) API.
    Provides full-text search capabilities with time-series sharding logic.
    Resources (e.g., 'users', 'posts') are configured dynamically.
  version: 1.0.0
servers:
  - url: http://localhost:3200
    description: Local server

paths:
  /health:
    get:
      summary: Health check
      description: Returns the health status of the service.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok

  /{resource}/maintenance:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    get:
      summary: Check maintenance mode
      tags: [Management]
      responses:
        "200":
          description: Current maintenance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"
    post:
      summary: Enable maintenance mode
      tags: [Management]
      responses:
        "200":
          description: Maintenance mode enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"
    delete:
      summary: Disable maintenance mode
      tags: [Management]
      responses:
        "200":
          description: Maintenance mode disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"

  /{resource}/queue:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    delete:
      summary: Clear task queue (Requires Maintenance Mode)
      tags: [Management]
      responses:
        "200":
          description: Queue cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: queue cleared
        "409":
          description: Maintenance mode required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Maintenance mode required

  /{resource}/flush:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    post:
      summary: Flush pending tasks (SYNC)
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/WaitQuery"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wait:
                  type: number
                  description: Wait time in seconds
      responses:
        "200":
          description: Flush completed within the requested wait period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "202":
          description: Flush task accepted without waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "408":
          description: Wait period expired; the flush task continues in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTimeoutResponse"

  /{resource}/optimize:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    post:
      summary: Optimize a specific shard
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/WaitQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timestamp
              properties:
                timestamp:
                  type: number
                  description: Target timestamp to identify the shard bucket
                wait:
                  type: number
      responses:
        "200":
          description: Optimization completed within the requested wait period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "202":
          description: Optimization task accepted without waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "408":
          description: Wait period expired; the optimization task continues in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTimeoutResponse"

  /{resource}/reconstruct:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    post:
      summary: Reconstruct a shard index
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/WaitQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timestamp
              properties:
                timestamp:
                  type: number
                newInitialId:
                  type: number
                useExternalId:
                  type: boolean
                wait:
                  type: number
      responses:
        "200":
          description: Reconstruction completed within the requested wait period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "202":
          description: Reconstruction task accepted without waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "408":
          description: Wait period expired; the reconstruction task continues in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTimeoutResponse"

  /{resource}/reserve:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    post:
      summary: Reserve document IDs (Requires Maintenance Mode)
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/WaitQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documents
              properties:
                documents:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - timestamp
                    properties:
                      id:
                        type: string
                      timestamp:
                        type: number
                wait:
                  type: number
      responses:
        "200":
          description: Reservation completed within the requested wait period
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TaskResponse"
                  - type: object
                    properties:
                      count:
                        type: number
        "202":
          description: Reservation task accepted without waiting
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TaskResponse"
                  - type: object
                    properties:
                      count:
                        type: number
        "408":
          description: Wait period expired; the reservation task continues in the background
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TaskTimeoutResponse"
                  - type: object
                    properties:
                      count:
                        type: number
        "409":
          description: Maintenance mode required

  /{resource}/shards:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    get:
      summary: List index files (shards)
      tags: [Management]
      parameters:
        - name: detailed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of index files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndexFileInfo"

  /{resource}/shards/{timestamp}:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
      - name: timestamp
        in: path
        required: true
        schema:
          type: number
    delete:
      summary: Drop a specific shard
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/WaitQuery"
      responses:
        "200":
          description: Drop completed within the requested wait period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "202":
          description: Drop task accepted without waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "408":
          description: Wait period expired; the drop task continues in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTimeoutResponse"

  /{resource}/tokenize:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    get:
      summary: Tokenize text
      tags: [Search]
      parameters:
        - name: text
          in: query
          required: true
          schema:
            type: string
        - name: locale
          in: query
          schema:
            type: string
            default: en
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /{resource}/search:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    get:
      summary: Execute full-text search
      tags: [Search]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: locale
          in: query
          schema:
            type: string
            default: en
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: timeout
          in: query
          description: Search time limit in seconds; fractional values are accepted
          schema:
            type: number
            default: 1
        - name: label
          in: query
          description: Exact document label filter. Repeat to require multiple labels (AND).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: numericOp
          in: query
          description: Comparison operator for numericValue. Must be specified together with numericValue.
          schema:
            type: string
            enum: [eq, gt, gte, lt, lte]
        - name: numericValue
          in: query
          description: Numeric filter value. Must be specified together with numericOp.
          schema:
            type: number
      responses:
        "200":
          description: List of matching document IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /{resource}/search-fetch:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
    get:
      summary: Search and fetch document details
      tags: [Search]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: locale
          in: query
          schema:
            type: string
            default: en
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: timeout
          in: query
          description: Search time limit in seconds; fractional values are accepted
          schema:
            type: number
            default: 1
        - name: label
          in: query
          description: Exact document label filter. Repeat to require multiple labels (AND).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: numericOp
          in: query
          description: Comparison operator for numericValue. Must be specified together with numericValue.
          schema:
            type: string
            enum: [eq, gt, gte, lt, lte]
        - name: numericValue
          in: query
          description: Numeric filter value. Must be specified together with numericOp.
          schema:
            type: number
        - name: omitBodyText
          in: query
          schema:
            type: boolean
        - name: omitAttrs
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /{resource}/{docId}:
    parameters:
      - $ref: "#/components/parameters/ResourcePath"
      - name: docId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Fetch a single document
      tags: [Document]
      parameters:
        - name: omitBodyText
          in: query
          schema:
            type: boolean
        - name: omitAttrs
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Document not found

    put:
      summary: Add or update a document
      tags: [Document]
      parameters:
        - $ref: "#/components/parameters/WaitQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
                - timestamp
                - attrs
                - labels
                - numericValue
              properties:
                text:
                  type: string
                timestamp:
                  type: number
                locale:
                  type: string
                  default: en
                attrs:
                  type: string
                  nullable: true
                  description: JSON string of extra attributes
                labels:
                  type: array
                  description: Opaque case-insensitive labels. Printable characters and U+0020 SPACE are allowed.
                  items:
                    type: string
                numericValue:
                  type: number
                  nullable: true
                  description: Generic nullable numeric value used by numeric search filters
                wait:
                  type: number
      responses:
        "200":
          description: Task completed within the requested wait period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "202":
          description: Task accepted without waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "408":
          description: Wait period expired; the task continues in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTimeoutResponse"

    delete:
      summary: Remove a document
      tags: [Document]
      parameters:
        - $ref: "#/components/parameters/WaitQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timestamp
              properties:
                timestamp:
                  type: number
                wait:
                  type: number
      responses:
        "200":
          description: Task completed within the requested wait period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "202":
          description: Task accepted without waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "408":
          description: Wait period expired; the task continues in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTimeoutResponse"

components:
  parameters:
    ResourcePath:
      name: resource
      in: path
      required: true
      description: Name of the resource (e.g., users, posts)
      schema:
        type: string
    WaitQuery:
      name: wait
      in: query
      description: Wait for task completion in seconds; fractional values are accepted
      schema:
        type: number

  schemas:
    MaintenanceStatus:
      type: object
      properties:
        enabled:
          type: boolean

    TaskResponse:
      type: object
      properties:
        result:
          type: string
          example: completed
        taskId:
          type: string

    TaskTimeoutResponse:
      allOf:
        - $ref: "#/components/schemas/TaskResponse"
        - type: object
          properties:
            result:
              type: string
              example: timeout
            message:
              type: string
              example: The task is still being processed

    Document:
      type: object
      properties:
        id:
          type: string
        bodyText:
          type: string
          nullable: true
        attrs:
          type: string
          nullable: true
          description: JSON string
        labels:
          type: array
          items:
            type: string
        numericValue:
          type: number
          nullable: true

    IndexFileInfo:
      type: object
      properties:
        path:
          type: string
        name:
          type: string
        startTimestamp:
          type: number
        size:
          type: number
        walSize:
          type: number
